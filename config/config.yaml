refresh:
  # Minutes between runs of each job. The GitHub schedule fires every 5 minutes (best effort).
  insiders_live: 5
  sale_notices: 10            # Form 144 notices of planned insider sales
  activists_live: 5
  etf_daily: 120              # the funds' daily holdings files (new once a day)
  short_volume: 180           # FINRA's daily short-sale volume file (posted by 6pm ET)
  etoro: 15
  congress_house: 30
  congress_senate: 60
  funds: 360                  # every 6h normally …
  funds_deadline_window: 30   # … every 30 min during 13F deadline weeks
  prices_market_hours: 15
  prices_off_hours: 120
  daily_backstop: 1440        # yesterday's SEC daily index (catches anything missed)
  splits: 720                 # stock splits → keeps the stored price history on one basis
  track_records: 1440         # daily rebuild of win rates (cheap once caches are warm)
  fundamentals: 1440
  companies: 30               # SEC company financials (per_run at a time)
  filings_live: 10            # new 8-Ks from the EDGAR live feed
  headlines: 60
  forecasts: 30               # rebuilt only after a new daily close
  forecast_grading: 360
  backtest: 1440
  run_budget_minutes: 9       # stop starting new jobs after this long (keeps runs from piling up)
