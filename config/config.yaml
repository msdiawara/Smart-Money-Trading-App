# Smart Money Radar — settings you can edit on GitHub (pencil icon) from your phone.
# Secrets (API keys, your e-mail) do NOT go here — add them under Settings → Secrets and variables → Actions.

app:
  name: "Smart Money Radar"
  max_events: 2500            # how many recent trades the app keeps
  feed_days: 120              # drop events older than this

alerts:
  # Push a notification when a new trade scores at least this high (0-100). 70 = "Strong" signals only.
  min_score: 70
  # Always alert on these, whatever the score (tickers and/or names, case-insensitive)
  watch_tickers: []           # e.g. ["NVDA", "PLTR"]
  watch_people: []            # e.g. ["Pelosi", "Pershing Square", "Cook Timothy"]
  max_per_run: 6              # cap per refresh (alerts are bundled)
  max_per_day: 60             # stays far below ntfy's free 250/day limit
  quiet_hours_et: [23, 6]     # no pushes between 11pm and 6am Eastern (they're queued to the morning)

analyst:
  # Claude as the analyst (needs the ANTHROPIC_API_KEY secret; see the setup guide). Runs every ~20 minutes in its
  # own workflow. Real costs are computed from the API's usage reports and shown on the Data tab.
  enabled: true
  daily_budget_usd: 3.0       # hard daily cap. Max 5x/20x plans include $100/$200 a month of API credit.
  deep_model: claude-opus-5-5 # Fable 5.1-level on most work at 40% of the price. Or claude-fable-5-1 (2.5x the cost).
  deep_effort: max            # low | medium | high | xhigh | max
  deep_max_searches: 6        # web searches per deep analysis ($10 per 1,000 searches)
  web_search_tool: web_search_20250305   # the basic tool; newer versions add code-run "dynamic filtering" (extra billing)
  deep_max_tokens: 20000      # output cap per call (keeps a non-streamed call well under ~10 minutes)
  deep_max_task_usd: 2.5      # a single deep analysis stops if it would cost more than this
  standard_max_task_usd: 0.4
  standard_model: claude-opus-5-5
  standard_effort: low        # quick reads (no web research) for notable signals
  deep_min_score: 70          # deep research for strong signals (and anything on your watchlist)
  standard_min_score: 50      # quick reads for notable signals
  max_deep_per_run: 4
  max_standard_per_run: 12
  ideas_per_day: 3            # deep write-ups of the best screen ideas
  brief_times_et: ["07:45"]   # weekday market brief, in quotes (add "16:45" for an after-close brief)
  parallel: 3
  forecasts_per_day: 3        # Claude price forecasts (watchlist first), each ~$0.30-0.60 at effort high
  forecast_effort: high
  postmortems_per_day: 2      # Claude investigates its biggest misses and writes a lesson for next time

forecast:
  # Price forecasts for every stock in the app (1 day to 1 year), graded in the open on Records → Forecasts.
  enabled: true
  paths: 2000                 # simulated price paths per stock
  ledger_max: 250             # stocks whose forecasts are written to the report card each day (watchlist first)
  equity_premium: 0.05        # expected return above cash per unit of beta (an assumption, not a prediction)
  risk_free: 0.04             # used when FRED isn't connected (otherwise the fed funds rate)
  backtest: true              # re-run the model on past dates so accuracy (and calibration) start on day one
  backtest_stocks: 150
  # macro_events: [{date: "2027-01-08", kind: cpi}]   # extra Fed (fomc) / CPI dates beyond the built-in calendar

valuation:
  # Cheap or expensive versus companies with similar growth, margins and industry (SEC financial data).
  per_run: 150                # companies fetched from the SEC per half-hour run (each needs 2 requests)
  discount_rate: 0.09         # for the reverse DCF ("growth the price assumes")
  terminal_growth: 0.03

news:
  gdelt: true                 # headlines from the GDELT Project (free; cite and link back)
  per_run: 12                 # GDELT asks for at most one request every 5 seconds
  max_tickers: 300
  # Massive (ex-Polygon) news isn't used: its free/individual plans are a personal, non-display licence and this
  # app's site is public. (The setting is kept for a future licensed option; it does nothing today.)
  massive: false

bubble:
  # The AI basket: drives the AI bubble gauge and each stock's AI exposure. Edit freely; unknown tickers are skipped.
  core: [NVDA, AMD, AVGO, TSM, MU, ARM, MRVL, SMCI, ASML, AMAT, LRCX, KLAC, ALAB, CRWV, NBIS, PLTR, AI, SOUN, COHR]
  platform: [MSFT, GOOGL, AMZN, META, ORCL, CRM, NOW, SNOW, ADBE, IBM]
  power: [VRT, ANET, CEG, VST, TLN, ETN, GEV, DELL, HPE, CLS, EQIX, DLR, PWR, NRG, OKLO]

conviction:
  # "Top conviction" needs every check (see the stock page); these are the thresholds.
  min_claude_p: 0.58          # Claude's chance of beating the S&P 500 over ~3 months
  min_edge_vs_base: 0.08      # ...and this far above the measured base rate
  min_adv_usd: 5000000        # trades at least this much a day

selfcheck:
  alert_on_fail: true         # push a notice when the self-check finds a new failure (at most every 6 hours)

etf:
  # Daily trades of transparent active ETFs, from the holdings files the funds themselves must post every trading
  # day (SEC Rule 6c-11). Default: ARK's six active funds. The files are checked every 2 hours (they change once
  # a day) and only the day-over-day changes are published, with a link to the fund's file. If a fund's file
  # moves, paste the "Full Holdings CSV" link from its page as `url`.
  enabled: true
  funds:
    - {ticker: ARKK}
    - {ticker: ARKW}
    - {ticker: ARKG}
    - {ticker: ARKQ}
    - {ticker: ARKF}
    - {ticker: ARKX}
  # - {ticker: XYZ, name: "Some Active ETF", manager: "Manager name", url: "https://.../holdings.csv"}

insiders:
  min_value_usd: 0            # ignore tiny trades below this $ value in the feed (0 = keep all)
  show_non_discretionary: true  # option exercises, tax withholding, grants, gifts (shown, scored as noise)

congress:
  house: true
  senate: true
  # Party leaders (Speaker, floor leaders, whips, caucus/conference chairs) are detected automatically from the
  # @unitedstates congress-legislators data, refreshed daily. Add anyone else by Bioguide ID (bioguide.congress.gov):
  leadership_extra: []

etoro:
  # OFF by default: eToro says its API connectors aren't currently offered to US clients, and its terms allow
  # personal use only — this app's website is public, so enabling it republishes other investors' positions.
  enabled: false
  period: "AbsOneYear"        # ranking window
  top_n: 20                   # how many top investors to follow
  max_risk_score: 6           # eToro risk score 1-10; 6 or lower filters out the gamblers
  min_trades: 30              # need enough closed trades for a win rate to mean anything
  min_copiers: 100

funds:
  # Concentrated, long-term managers copy best (see docs/DATA_SOURCES.md §8).
