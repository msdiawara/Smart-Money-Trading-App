name: Keep the schedule alive
# GitHub pauses scheduled workflows in repositories with no activity for 60 days.
# This makes one tiny commit a month so the 5-minute refresh never silently stops.
on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "keepalive $(date -u +%F)" || true
          git push || true
      - name: Make sure the refresh schedule is switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable refresh.yml --repo "$GITHUB_REPOSITORY" || true
