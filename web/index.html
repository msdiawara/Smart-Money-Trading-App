<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smart Money Radar</title>
  <meta name="description" content="Insider, hedge-fund, activist, Congress and top-trader moves from official filings, scored and explained.">
  <meta name="theme-color" content="#edf0ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1213" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.anthropic.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartMoney">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand" aria-label="Smart Money Radar">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2" opacity=".6"/><path d="M16 16 L27 9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="23" cy="11.5" r="2.6" fill="currentColor"/></svg>
      <span>Smart Money Radar</span>
    </div>
    <button id="refresh" class="pill" aria-label="Refresh now and run the self-check"><span id="fresh-dot" class="dot"></span><span id="updated">Loading…</span><span id="audit-flag" class="audit-flag" hidden title="The self-check found a problem"></span></button>
    <button id="theme-btn" class="icon-btn" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <nav class="tabs" aria-label="Sections">
    <a href="#/feed" data-tab="feed"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Feed</span></a>
    <a href="#/ask" data-tab="ask"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Ask</span></a>
    <a href="#/ideas" data-tab="ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span>Ideas</span></a>
    <a href="#/watch" data-tab="watch"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6L3.3 9.2l6.1-.6z"/></svg><span>Watch</span></a>
    <a href="#/leaders" data-tab="leaders"><svg viewBox="0 0 24 24"><path d="M7 21V10M12 21V4M17 21v-7"/></svg><span>Records</span></a>
    <a href="#/results" data-tab="results"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.8"/></svg><span>Results</span></a>
    <a href="#/more" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>More</span></a>
  </nav>

  <noscript><p class="pad">This app needs JavaScript.</p></noscript>
  <script src="charts.js" defer></script>
  <script src="app.js" defer></script>
  <script src="stock.js" defer></script>
  <script src="accuracy.js" defer></script>
  <script src="results.js" defer></script>
  <script src="chat.js" defer></script>
</body>
</html>
